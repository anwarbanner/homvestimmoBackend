[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; Filament charge beaucoup de requêtes en parallèle (assets, Livewire, polling).
; Le pool par défaut (pm.max_children=5) sature vite et fait mettre en file
; d'attente les requêtes cote nginx -> 504 / timeout intermittents.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Coupe une requête qui bloquerait anormalement longtemps au lieu de
; saturer tout le pool indéfiniment.
request_terminate_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no
